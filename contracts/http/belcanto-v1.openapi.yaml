        lessonId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        expectedVersion:
          type: integer
          minimum: 0
        expectedPreviousTeacherAccountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    ReplaceLessonTeachersRequest:
      type: object
      additionalProperties: false
      required: [lessons, newTeacherAccountId]
      properties:
        lessons:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LessonTeacherReplacementTarget"
        newTeacherAccountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    LessonTeacherReplacementResult:
      type: object
      additionalProperties: false
      required: [updatedCount, lessons]
      properties:
        updatedCount:
          type: integer
          minimum: 1
        lessons:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Lesson"
    PrimaryTeacherReassignmentTarget:
      type: object
      additionalProperties: false
      required: [studentId, expectedAssignmentVersion]
      properties:
        studentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        expectedAssignmentVersion:
          type: integer
          minimum: 0
    ReassignPrimaryTeachersRequest:
      type: object
      additionalProperties: false
      required: [students, newTeacherAccountId, effectiveMode]
      oneOf:
        - properties:
            effectiveMode:
              const: immediate
          not:
            required: [effectiveFrom]
            properties:
              effectiveFrom: {}
        - required: [effectiveFrom]
          properties:
            effectiveMode:
              const: scheduled
      properties:
        students:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PrimaryTeacherReassignmentTarget"
        newTeacherAccountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        effectiveFrom:
          type: string
          format: date-time
        effectiveMode:
          type: string
          enum: [immediate, scheduled]
    PrimaryTeacherReassignment:
      type: object
      additionalProperties: false
      required:
        - studentId
        - previousTeacherAccountId
        - newTeacherAccountId
        - effectiveFrom
        - version
      properties:
        studentId:
          type: string
        previousTeacherAccountId:
          type: string
        newTeacherAccountId:
          type: string
        effectiveFrom:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    PrimaryTeacherReassignmentResult:
      type: object
      additionalProperties: false
      required: [reassignedCount, assignments]
      properties:
        reassignedCount:
          type: integer
          minimum: 1
        assignments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PrimaryTeacherReassignment"
    PublishFirstMinuteRequest:
      type: object
      additionalProperties: false
      required: [whatWorked, currentFocus, nextStep, expectedVersion]
      properties:
        whatWorked:
          type: string
          minLength: 1
          maxLength: 500
        currentFocus:
          type: string
          minLength: 1
          maxLength: 500
        nextStep:
          type: string
          minLength: 1
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 0
    FirstMinute:
      type: object
      additionalProperties: false
      required:
        - studentId
        - revision
        - whatWorked
        - currentFocus
        - nextStep
        - publishedAt
      properties:
        studentId:
          type: string
        revision:
          type: integer
          minimum: 1
        whatWorked:
          type: string
        currentFocus:
          type: string
        nextStep:
          type: string
        publishedAt:
          type: string
          format: date-time
    InvitationResult:
      type: object
      additionalProperties: false
      required: [invitationId, studentId, status, expiresAt, activationLink]
      properties:
        invitationId:
          type: string
        studentId:
          type: string
        status:
          const: issued
        expiresAt:
          type: string
          format: date-time
        activationLink:
          $ref: "#/components/schemas/ActivationLink"
    ActivationLink:
      type: string
      format: uri
      pattern: '^(?:belcanto://activate|https://[^/?#@]+/activate)#token=[A-Za-z0-9_-]{43}$'
      description: >-
        Canonical one-time activation link. The custom scheme is permitted only
        for local development. A production client additionally requires the
        HTTPS origin to equal its build-time verified app-link origin.
