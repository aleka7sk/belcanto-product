        resubmission is possible only after teacher feedback.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HomeworkId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitHomeworkRequest"
      responses:
        "200":
          description: Homework after the submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkAssignment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/homework/{homeworkId}/review:
    post:
      summary: Review the latest submission
      operationId: reviewHomework
      tags: [Practice]
      description: >-
        needs_revision keeps the loop open; accepted completes the
        homework and may append one named-area progress evidence
        (DEC-006 — no score anywhere).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HomeworkId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewHomeworkRequest"
      responses:
        "200":
          description: Homework after the review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeworkAssignment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/students/{studentId}/homework:
    get:
      summary: List Student homework
      operationId: listStudentHomework
      tags: [Practice]
      description: >-
        Newest first. The Student sees everything except drafts; teachers
        see their own assignments; managers see all.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/JournalStudentId"
      responses:
        "200":
          description: Homework list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HomeworkAssignment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"


  /v1/lessons:
    get:
      summary: List role-scoped Lessons
      operationId: listLessons
      tags: [Scheduling]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: studentId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        - name: teacherAccountId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      responses:
        "200":
          description: Lessons visible within the authenticated role scopes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      summary: Schedule a future Lesson
      operationId: scheduleLesson
      tags: [Scheduling]
      description: >-
        Owner or Administrator may choose any eligible same-tenant Teacher and
        enrolled Students. Teacher may choose self and only Students assigned
        to that Teacher at startsAt. Student cannot mutate Lessons. Teacher and
        Student time intervals cannot overlap an existing scheduled Lesson.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleLessonRequest"
      responses:
        "201":
          description: Scheduled Lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/lessons/teacher-replacements:
    post:
      summary: Replace Teacher on selected future Lessons
      operationId: replaceLessonTeachers
      tags: [Scheduling]
      description: >-
        Owner or ordinary Administrator only; independent of B.0 delegation.
        Only explicitly listed scheduled future Lessons change. Every target
        carries expectedVersion and the entire batch is atomic.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceLessonTeachersRequest"
      responses:
        "200":
          description: Selected Lessons updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonTeacherReplacementResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/lessons/{lessonId}:
    get:
      summary: Read one role-scoped Lesson
      operationId: getLesson
      tags: [Scheduling]
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      responses:
        "200":
          description: Lesson detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/students/{studentId}/first-minute:
    put:
      summary: Publish the First Belcanto Minute
      operationId: publishFirstBelcantoMinute
      tags: [Onboarding]
      description: Only the same-tenant, actively assigned Teacher can publish.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishFirstMinuteRequest"
      responses:
        "200":
          description: Published immutable revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstMinute"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/students/{studentId}/activation-invitations:
    post:
      summary: Issue a student activation invitation
      operationId: issueStudentActivationInvitation
      tags: [Onboarding]
      description: >-
        Owner-only operation. Issues a seven-day, one-time invitation only
        after the First Belcanto Minute exists. The response is the only
        client-facing delivery of the activation link for this operation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Invitation issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/students/{studentId}/activation-invitations/reissue:
    post:
      summary: Reissue a student activation invitation
      operationId: reissueStudentActivationInvitation
      tags: [Onboarding]
      description: >-
        Owner-only operation. Atomically invalidates the prior unconsumed
        invitation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Replacement invitation issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/activation-invitations/{invitationId}/revoke:
    post:
      summary: Revoke a student activation invitation
      operationId: revokeStudentActivationInvitation
      tags: [Onboarding]
      description: Owner-only operation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Issued invitation revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    EventOccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SpotOfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    HomeworkId:
      name: homeworkId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    HomeworkTaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    JournalStudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RescheduleRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable key for one user intent. A retry must reuse the same key and
        payload; a new intent must use a new key.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\u0021-\u007E]+$'
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    DelegationId:
      name: delegationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'

  responses:
    InvalidInput:
      description: Request shape or value is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidInputError"
    ActivationInvalid:
      description: Invitation is invalid, expired, revoked, superseded, or consumed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ActivationInvalidError"
    Unauthenticated:
      description: Authentication or fresh credential verification failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthenticatedError"
    Forbidden:
      description: Authenticated principal lacks effective permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    NotFound:
      description: Same-tenant resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    Conflict:
      description: State, version, uniqueness, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictError"
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitedError"
    Internal:
      description: An unexpected server failure occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalError"
    Unavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnavailableError"

  schemas:
    Role:
      type: string
      enum: [Owner, Administrator, Teacher, Student]
    AccessProfile:
      type: string
      description: >-
        StudentOnboardingManager.v1 delegates exactly students.create and
        student_onboarding.read. It never delegates invitation management.
      enum: [StudentOnboardingManager.v1]
    Permission:
      type: string
      enum:
        - students.create
        - student_onboarding.read
        - student_invitations.issue
        - student_invitations.reissue
        - student_invitations.revoke
        - student_onboarding.delegate
        - lessons.read
        - lessons.create
        - lesson_teachers.replace
        - student_primary_teachers.reassign
    ErrorCode:
      type: string
      enum:
        - INVALID_INPUT
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE
        - ACTIVATION_INVALID
        - RATE_LIMITED
        - UNAVAILABLE
        - INTERNAL
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              minLength: 1
            requestId:
              type: string
              minLength: 1
    InvalidInputError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: INVALID_INPUT
    ActivationInvalidError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: ACTIVATION_INVALID
    UnauthenticatedError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: UNAUTHENTICATED
    ForbiddenError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: FORBIDDEN
    NotFoundError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: NOT_FOUND
    ConflictError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  type: string
                  enum: [CONFLICT, INVALID_STATE]
    RateLimitedError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: RATE_LIMITED
    InternalError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: INTERNAL
    UnavailableError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - properties:
            error:
              properties:
                code:
                  const: UNAVAILABLE
    ActivationPreviewRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
    ActivationPreview:
      type: object
      additionalProperties: false
      required: [invitationId, kind, displayName, maskedPhone, expiresAt]
      properties:
        invitationId:
          type: string
        kind:
          type: string
          enum: [owner_bootstrap, staff_activation, student_activation]
        displayName:
          type: string
        maskedPhone:
          type: string
        expiresAt:
          type: string
          format: date-time
    CompleteActivationRequest:
      type: object
      additionalProperties: false
      required: [token, phone, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        phone:
          type: string
          description: Phone invited by the school; normalized to E.164 by the API.
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
    SignInRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password
        deviceLabel:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional client-declared device name for the session inventory.
        platform:
          type: string
          enum: [ios, android, web]
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
    RequestPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
    CompletePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        newPassword:
          type: string
          format: password
    SignInOutcome:
      oneOf:
        - type: object
          additionalProperties: false
          required: [tokens]
          properties:
            tokens:
              $ref: "#/components/schemas/SessionTokens"
        - type: object
          additionalProperties: false
          required: [twofaChallenge, twofaExpiresAt]
          properties:
            twofaChallenge:
              type: string
              minLength: 43
              maxLength: 43
              pattern: '^[A-Za-z0-9_-]{43}$'
            twofaExpiresAt:
              type: string
              format: date-time
    TwofaSignInRequest:
      type: object
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        code:
          type: string
          minLength: 6
          maxLength: 16
    ActivationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
    ActivationPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, phone, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        phone:
          type: string
        password:
          type: string
          format: password
    ActivationContactRequest:
      type: object
      additionalProperties: false
      required: [token, kind, value]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        kind:
          type: string
          enum: [email, phone]
        value:
          type: string
          minLength: 3
          maxLength: 254
    ActivationCodeRequest:
      type: object
      additionalProperties: false
      required: [token, code]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        code:
          type: string
          minLength: 6
          maxLength: 16
    ActivationFinishRequest:
      type: object
      additionalProperties: false
      required: [token, phone]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        phone:
          type: string
    ActivationProgressView:
      type: object
      additionalProperties: false
      required: [invitationId, kind, displayName, expiresAt, passwordSet, contactVerified, twofaEnrolled, completed]
      properties:
        invitationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        kind:
          type: string
          enum: [owner_bootstrap, staff_activation, student_activation]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        expiresAt:
          type: string
          format: date-time
        passwordSet:
          type: boolean
        contactKind:
          type: string
          enum: [email, phone]
        contactMasked:
          type: string
          minLength: 1
          maxLength: 254
        contactVerified:
          type: boolean
        twofaEnrolled:
          type: boolean
        completed:
          type: boolean
    VerifiedContact:
      type: object
      additionalProperties: false
      required: [id, kind, value, verifiedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        kind:
          type: string
          enum: [email, phone]
        value:
          type: string
          minLength: 3
          maxLength: 254
        verifiedAt:
          type: string
          format: date-time
    StartContactChangeRequest:
      type: object
      additionalProperties: false
      required: [kind, value, currentPassword]
      properties:
        kind:
          type: string
          enum: [email, phone]
        value:
          type: string
          minLength: 3
          maxLength: 254
        currentPassword:
          type: string
