      properties:
        studentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        fullName:
          type: string
          minLength: 1
          maxLength: 200
    Lesson:
      type: object
      additionalProperties: false
      required: [id, title, startsAt, durationMinutes, teacher, students, status, version]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        location:
          type: string
          minLength: 1
          maxLength: 200
        teacher:
          $ref: "#/components/schemas/TeacherSummary"
        students:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LessonStudent"
        status:
          const: scheduled
        version:
          type: integer
          minimum: 0
    ScheduleLessonRequest:
      type: object
      additionalProperties: false
      required: [title, startsAt, durationMinutes, teacherAccountId, studentIds]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        location:
          type: string
          minLength: 1
          maxLength: 200
        teacherAccountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        studentIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    LessonTeacherReplacementTarget:
      type: object
