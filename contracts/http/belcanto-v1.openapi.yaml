          type: string
          format: password
    RevokeOtherSessionsResult:
      type: object
      additionalProperties: false
      required: [revokedCount]
      properties:
        revokedCount:
          type: integer
          minimum: 0
    SecurityEvent:
      type: object
      additionalProperties: false
      required: [id, action, decision, recordedAt]
      properties:
        id:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - SessionCreated
            - SessionRefreshed
            - SessionRevoked
            - RefreshTokenReuseDetected
            - AccountActivated
            - PasswordResetRequested
            - PasswordResetCompleted
            - OtherSessionsRevoked
            - ContactChangeStarted
            - ContactVerified
            - TwofaEnrolled
            - TwofaDisabled
            - TwofaChallengeFailed
        decision:
          type: string
          enum: [allow, deny]
        reasonCode:
          type: string
          minLength: 1
          maxLength: 100
        targetType:
          type: string
          minLength: 1
          maxLength: 100
        targetId:
          type: string
          minLength: 1
          maxLength: 128
        recordedAt:
          type: string
          format: date-time
    SecurityEventsPage:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
        nextCursor:
          type: string
          minLength: 1
          maxLength: 64
    SessionTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessExpiresAt, refreshExpiresAt]
      properties:
        accessToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        refreshToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        accessExpiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
    BootstrapView:
      type: object
      additionalProperties: false
      required: [accountId, roles, accessProfiles, permissions]
      dependentRequired:
        firstMinute: [studentId]
      allOf:
        - if:
            properties:
              roles:
                contains:
                  const: Student
            required: [roles]
          then:
            properties:
              studentId: {}
              fullName: {}
              firstMinute: {}
            required: [studentId, fullName, firstMinute]
          else:
            not:
              anyOf:
                - properties:
                    studentId: {}
                  required: [studentId]
                - properties:
                    fullName: {}
                  required: [fullName]
                - properties:
                    firstMinute: {}
                  required: [firstMinute]
        - if:
            properties:
              roles:
                contains:
                  const: Owner
            required: [roles]
          then:
            properties:
              accessProfiles:
                maxItems: 0
              permissions:
                minItems: 10
                maxItems: 10
                allOf:
                  - contains: { const: students.create }
                  - contains: { const: student_onboarding.read }
                  - contains: { const: student_invitations.issue }
                  - contains: { const: student_invitations.reissue }
                  - contains: { const: student_invitations.revoke }
                  - contains: { const: student_onboarding.delegate }
                  - contains: { const: lessons.read }
                  - contains: { const: lessons.create }
                  - contains: { const: lesson_teachers.replace }
                  - contains: { const: student_primary_teachers.reassign }
          else:
            if:
              properties:
                roles:
                  contains:
                    const: Administrator
              required: [roles]
            then:
              if:
                properties:
                  accessProfiles:
                    contains:
                      const: StudentOnboardingManager.v1
                required: [accessProfiles]
              then:
                properties:
                  permissions:
                    minItems: 6
                    maxItems: 6
                    allOf:
                      - contains: { const: students.create }
                      - contains: { const: student_onboarding.read }
                      - contains: { const: lessons.read }
                      - contains: { const: lessons.create }
                      - contains: { const: lesson_teachers.replace }
                      - contains: { const: student_primary_teachers.reassign }
              else:
                properties:
                  accessProfiles:
                    maxItems: 0
                  permissions:
                    minItems: 4
                    maxItems: 4
                    allOf:
                      - contains: { const: lessons.read }
                      - contains: { const: lessons.create }
                      - contains: { const: lesson_teachers.replace }
                      - contains: { const: student_primary_teachers.reassign }
            else:
              if:
                properties:
                  roles:
                    contains:
                      const: Teacher
                required: [roles]
              then:
                properties:
                  accessProfiles:
                    maxItems: 0
                  permissions:
                    minItems: 2
                    maxItems: 2
                    allOf:
                      - contains: { const: lessons.read }
                      - contains: { const: lessons.create }
              else:
                if:
                  properties:
                    roles:
                      contains:
                        const: Student
                  required: [roles]
                then:
                  properties:
                    accessProfiles:
                      maxItems: 0
                    permissions:
                      minItems: 1
                      maxItems: 1
                      contains: { const: lessons.read }
                else:
                  properties:
                    permissions:
                      maxItems: 0
      properties:
        accountId:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        accessProfiles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccessProfile"
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Permission"
        studentId:
          type: string
        fullName:
          type: string
        firstMinute:
          $ref: "#/components/schemas/FirstMinute"
    StaffMember:
      type: object
      additionalProperties: false
      required: [accountId, fullName, roles, accessProfiles]
      dependentRequired:
        onboardingDelegationExpiresAt: [onboardingDelegationId]
      allOf:
        - if:
            properties:
              accessProfiles:
                contains:
                  const: StudentOnboardingManager.v1
            required: [accessProfiles]
          then:
            properties:
              roles:
                contains:
                  const: Administrator
              onboardingDelegationId: {}
              accessProfiles:
                minItems: 1
                maxItems: 1
            required: [onboardingDelegationId]
          else:
            properties:
              accessProfiles:
                maxItems: 0
            not:
              anyOf:
                - properties:
                    onboardingDelegationId: {}
                  required: [onboardingDelegationId]
                - properties:
                    onboardingDelegationExpiresAt: {}
                  required: [onboardingDelegationExpiresAt]
      properties:
        accountId:
          type: string
        fullName:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        accessProfiles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccessProfile"
        onboardingDelegationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        onboardingDelegationExpiresAt:
          type: string
          format: date-time
    GrantDelegationRequest:
