    BootstrapView:
      type: object
      additionalProperties: false
      required: [accountId, roles, accessProfiles, permissions]
      dependentRequired:
        firstMinute: [studentId]
      allOf:
        - if:
            properties:
              roles:
                contains:
                  const: Student
            required: [roles]
          then:
            properties:
              studentId: {}
              fullName: {}
              firstMinute: {}
            required: [studentId, fullName, firstMinute]
          else:
            not:
              anyOf:
                - properties:
                    studentId: {}
                  required: [studentId]
                - properties:
                    fullName: {}
                  required: [fullName]
                - properties:
                    firstMinute: {}
                  required: [firstMinute]
        - if:
            properties:
              roles:
                contains:
                  const: Owner
            required: [roles]
          then:
            properties:
              accessProfiles:
                maxItems: 0
              permissions:
                minItems: 10
                maxItems: 10
                allOf:
                  - contains: { const: students.create }
                  - contains: { const: student_onboarding.read }
                  - contains: { const: student_invitations.issue }
                  - contains: { const: student_invitations.reissue }
                  - contains: { const: student_invitations.revoke }
                  - contains: { const: student_onboarding.delegate }
                  - contains: { const: lessons.read }
                  - contains: { const: lessons.create }
                  - contains: { const: lesson_teachers.replace }
                  - contains: { const: student_primary_teachers.reassign }
          else:
            if:
              properties:
                roles:
                  contains:
                    const: Administrator
              required: [roles]
            then:
              if:
                properties:
                  accessProfiles:
                    contains:
                      const: StudentOnboardingManager.v1
                required: [accessProfiles]
              then:
                properties:
                  permissions:
                    minItems: 6
                    maxItems: 6
                    allOf:
                      - contains: { const: students.create }
                      - contains: { const: student_onboarding.read }
                      - contains: { const: lessons.read }
                      - contains: { const: lessons.create }
                      - contains: { const: lesson_teachers.replace }
                      - contains: { const: student_primary_teachers.reassign }
              else:
                properties:
                  accessProfiles:
                    maxItems: 0
                  permissions:
                    minItems: 4
                    maxItems: 4
                    allOf:
                      - contains: { const: lessons.read }
                      - contains: { const: lessons.create }
                      - contains: { const: lesson_teachers.replace }
                      - contains: { const: student_primary_teachers.reassign }
            else:
              if:
                properties:
                  roles:
                    contains:
                      const: Teacher
                required: [roles]
              then:
                properties:
                  accessProfiles:
                    maxItems: 0
                  permissions:
                    minItems: 2
                    maxItems: 2
                    allOf:
                      - contains: { const: lessons.read }
                      - contains: { const: lessons.create }
              else:
                if:
                  properties:
                    roles:
                      contains:
                        const: Student
                  required: [roles]
                then:
                  properties:
                    accessProfiles:
                      maxItems: 0
                    permissions:
                      minItems: 1
                      maxItems: 1
                      contains: { const: lessons.read }
                else:
                  properties:
                    permissions:
                      maxItems: 0
      properties:
        accountId:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        accessProfiles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccessProfile"
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Permission"
