      pattern: '^(?:belcanto://activate|https://[^/?#@]+/activate)#token=[A-Za-z0-9_-]{43}$'
      description: >-
        Canonical one-time activation link. The custom scheme is permitted only
        for local development. A production client additionally requires the
        HTTPS origin to equal its build-time verified app-link origin.
